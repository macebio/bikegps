# project.yml – XcodeGen configuration for BikeGPS
# Install XcodeGen:  brew install xcodegen
# Generate project:  cd iphone-app && xcodegen generate

name: BikeGPS

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  BikeGPS:
    type: application
    platform: iOS

    sources:
      - path: BikeGPS
        excludes:
          - "Resources/Info.plist"

    info:
      path: BikeGPS/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSLocationWhenInUseUsageDescription: "BikeGPS uses your location to display the map and send position to the bike display."
        NSLocationAlwaysAndWhenInUseUsageDescription: "BikeGPS needs background location so it can keep sending your position while your phone is in your pocket."
        NSBluetoothAlwaysUsageDescription: "BikeGPS connects to your ESP32 display over Bluetooth Low Energy."
        UIBackgroundModes:
          - location
          - bluetooth-central
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.bikegps
        PRODUCT_NAME: BikeGPS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: BikeGPS/Resources/Info.plist

    dependencies:
      - sdk: CoreLocation.framework
      - sdk: CoreBluetooth.framework
      - sdk: Foundation.framework
      - sdk: UIKit.framework
      - sdk: MapKit.framework
      - sdk: AVFoundation.framework

    preBuildScripts:
      - name: SwiftLint (optional – remove if not installed)
        script: |
          if which swiftlint > /dev/null; then swiftlint; fi
        showEnvVarsInLog: false
